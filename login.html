<body>
  <main class="auth-wrap">
    <div class="card">
      <div class="brand">🏋️ GymPlan</div>

      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Anmelden</button>
        <button id="tab-register" class="tab" type="button">Konto erstellen</button>
      </div>

      <!-- LOGIN VIEW -->
      <form id="form-login" class="form" autocomplete="on">
        <label class="field">
          <span>E-Mail</span>
          <input id="login-email" type="email" required autocomplete="email" />
        </label>
        <label class="field">
          <span>Passwort</span>
          <input id="login-password" type="password" required autocomplete="current-password" />
        </label>
        <button class="btn primary" type="submit">Anmelden</button>
        <p class="muted hint">Noch kein Konto?
          <a href="#" id="link-to-register">Jetzt erstellen</a>
        </p>
        <p id="login-msg" class="msg" role="alert" aria-live="polite"></p>
      </form>

      <!-- REGISTER VIEW (SPA in der Seite) -->
      <form id="form-register" class="form" hidden autocomplete="on">
        <label class="field">
          <span>E-Mail</span>
          <input id="reg-email" type="email" required autocomplete="email" />
        </label>
        <label class="field">
          <span>Passwort</span>
          <input id="reg-password" type="password" minlength="6" required autocomplete="new-password" />
        </label>
        <button class="btn primary" type="submit">Konto erstellen</button>
        <p class="muted hint">Schon ein Konto?
          <a href="#" id="link-to-login">Jetzt anmelden</a>
        </p>
        <p id="reg-msg" class="msg" role="alert" aria-live="polite"></p>
      </form>
    </div>

    <footer class="foot">
      <a href="index.html">Zur Startseite</a>
    </footer>
  </main>
  <script src="login.js"></script>
