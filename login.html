<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#00000000">
  
  <title>GymPlan • Anmelden</title>
  <link rel="manifest" href="manifest.webmanifest?v=4">
  <link rel="stylesheet" href="login.css" />

  <script>
  window.__SUPABASE_URL = "https://mfdfenmnaglfbvhdxgxr.supabase.co";
  window.__SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZGZlbm1uYWdsZmJ2aGR4Z3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE4MDk2NDcsImV4cCI6MjA3NzM4NTY0N30.jMPYkER-AM1D3NvHgPEi8ZHJ3kXtC9kttjTXKfzrDdE";
</script>


  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<!-- Mobile Gradient Header -->
<div class="mobile-header" aria-hidden="true">
  <div class="mobile-header__bg"></div>

  <!-- Obere Welle -->
  <svg class="mobile-header__wave" viewBox="0 0 375 100" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,100 C80,72 180,112 300,84 C340,76 375,78 375,78 L375,100 L0,100 Z" fill="#ffffff"/>
  </svg>
</div>


<main class="auth-wrap">
  <!-- Untere linke Deko (nur mobil) -->
<div class="mobile-deco" aria-hidden="true">
  <svg viewBox="0 0 300 300" preserveAspectRatio="none">
    <defs>
      <!-- gleicher Verlauf wie oben -->
      <linearGradient id="mobile-deco-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#f08db7"/>
        <stop offset="100%" stop-color="#6b5bff"/>
      </linearGradient>
    </defs>
    <!-- weiche „Blob“-Fläche unten links -->
    <path d="M0,300 L0,60 C36,88 84,120 94,164 C112,232 204,242 260,300 Z"
          fill="url(#mobile-deco-grad)"/>
  </svg>
</div>
  <div class="auth-inner">
<div class="hero">
  <h1 class="hero-title">Hallo</h1>
  <p class="hero-subtitle">Melde dich mit deinem Konto an</p>
</div>

<!-- LOGIN VIEW (neu gestylt) -->
<form id="form-login" class="form form-hello" autocomplete="on">
  <div class="pill-input">
    <span class="icon" aria-hidden="true">
      <!-- User-Icon -->
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14Z"/>
      </svg>
    </span>
    <input id="login-email" type="email" required autocomplete="email" placeholder="E-Mail" />
  </div>

  <div class="pill-input">
    <span class="icon" aria-hidden="true">
      <!-- Lock-Icon -->
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-6 0V6a2 2 0 0 1 4 0v2Z"/>
      </svg>
    </span>
    <input id="login-password" type="password" required autocomplete="current-password" placeholder="Passwort" />
  </div>

  <div class="inline-links right">
    <a href="#" id="link-forgot">Passwort vergessen?</a>
  </div>

  <div class="cta-row">
    <div class="cta-title">Anmelden</div>
    <button class="btn cta" type="submit" aria-label="Anmelden">
      <span class="arrow">→</span>
    </button>
  </div>

  <p id="login-msg" class="msg" role="alert" aria-live="polite"></p>

  <div class="inline-links">
    <span class="muted">Noch kein Konto?</span>
    <a href="#" id="link-to-register">Jetzt registrieren</a>
  </div>
</form>


    <!-- REGISTER VIEW (SPA in derselben Seite) -->
    <form id="form-register" class="form" hidden autocomplete="on">
      <label class="field">
        <span>E-Mail</span>
        <input id="reg-email" type="email" required autocomplete="email" />
      </label>
      <label class="field">
        <span>Passwort</span>
        <input id="reg-password" type="password" minlength="6" required autocomplete="new-password" />
      </label>
      <button class="btn primary" type="submit">
        <span>Registrieren</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </button>


      <div class="inline-links">
        <span class="muted">Schon ein Konto?</span>
        <a href="#" id="link-to-login">Zurück zum Login</a>
      </div>

      <p id="reg-msg" class="msg" role="alert" aria-live="polite"></p>
    </form>
  </div>
</main>

<!-- Theme Switcher -->
<div class="theme-switcher" aria-label="Darstellung umschalten">
  <button id="btn-light" class="theme-btn" title="Helles Theme" aria-pressed="false">
    <!-- Sonne -->
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12Zm0 4a1 1 0 0 1-1-1v-1h2v1a1 1 0 0 1-1 1Zm0-20a1 1 0 0 1 1-1v1h-2V2a1 1 0 0 1 1-1Zm10 9h-1v2h1a1 1 0 1 0 0-2ZM3 11H2a1 1 0 1 0 0 2h1v-2Zm15.95 7.536-.707-.707-1.414 1.414.707.707a1 1 0 0 0 1.414-1.414ZM6.172 4.464l-.707-.707A1 1 0 0 0 4.05 5.17l.707.707L6.172 4.464Zm12.122.707.707-.707A1 1 0 1 0 17.586 3.05l-.707.707 1.414 1.414ZM5.464 17.586l-1.414-1.414-.707.707A1 1 0 1 0 5.17 19l.707-.707Z"/>
    </svg>
  </button>

  <button id="btn-dark" class="theme-btn" title="Dunkles Theme" aria-pressed="false">
    <!-- Mond -->
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79Z"/>
    </svg>
  </button>
</div>

  <script src="login.js"></script>
</body>
</html>
